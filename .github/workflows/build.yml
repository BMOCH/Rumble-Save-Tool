name: Build standalone editor

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-build.txt
      - run: python build.py --onefile
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/RumbleSaveTool.exe -DestinationPath release/Rumble-Save-Tool-Windows.zip
      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          if [ -d dist/RumbleSaveTool.app ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/RumbleSaveTool.app release/Rumble-Save-Tool-macOS.zip
          else
            tar -czf release/Rumble-Save-Tool-macOS.tar.gz -C dist RumbleSaveTool
          fi
      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          tar -czf release/Rumble-Save-Tool-Linux.tar.gz -C dist RumbleSaveTool
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
